[tool.poetry]
name = "ideya-api"
version = "0.1.0"
description = "API de sugestões de lazer em Luanda com base no orçamento"
authors = []
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = "^0.115.0"
uvicorn = { version = "^0.34.0", extras = ["standard"] }
pyairtable = "^3.0.2"
pydantic-settings = "^2.8.0"
google-genai = "^1.11.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
